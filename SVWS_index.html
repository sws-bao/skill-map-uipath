      --text:#222;

    }
    *{box-sizing:border-box;}
    body{

      color:var(--text);

    .container{max-width:1200px;margin:0 auto;padding:28px 20px 50px;}
    .hero{
      background:linear-gradient(135deg, #1f4e79 0%, #2f6ea8 55%, #4f8cff 100%);
      color:#fff;border-radius:20px;padding:28px 28px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    }
    .hero::after{
      content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);
    }
    .hero h1{margin:0 0 10px;font-size:30px;line-height:1.2;}
    .hero p{margin:0;max-width:900px;opacity:.95;}
    .toolbar{
      display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 18px;
      background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid rgba(217,226,243,.9);
      border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);
    }
    .lang-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .lang-box label{font-weight:700;color:var(--primary);}
    .lang-btn{
      padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-weight:700;background:#fff;color:var(--primary);
      border:1px solid var(--border);transition:.25s;
    }
    .lang-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
    .lang-btn:hover{transform:translateY(-1px);}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px;}
    .tab-btn{
      border:none;background:#fff;color:var(--primary);padding:12px 16px;border-radius:999px;cursor:pointer;font-weight:700;
      border:1px solid var(--border);box-shadow:0 4px 12px rgba(31,78,121,.08);transition:all .25s ease;
    }
    .tab-btn:hover{transform:translateY(-2px);border-color:var(--accent);}
    .tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
    .panel{display:none;opacity:0;transform:translateY(10px);transition:opacity .35s ease, transform .35s ease;}
    .panel.active{display:block;opacity:1;transform:translateY(0);animation:fadeSlide .35s ease;}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
    .card h2{margin-top:0;color:var(--primary);font-size:24px;}

    .label{font-weight:700;color:var(--primary);}
    .ref a{color:#1155cc;text-decoration:none;word-break:break-word;}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .note{color:var(--muted);font-style:italic;margin-top:8px;}
    ul{margin-top:8px;}
    .footer{margin-top:18px;color:var(--muted);text-align:center;font-size:13px;}
    .hidden{display:none !important;}

    let currentLang = 'vi';
    let currentLevel = 1;

    function setLanguage(lang){
      currentLang = lang;
      document.getElementById('btnVi').classList.toggle('active', lang === 'vi');
      document.getElementById('btnEn').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
      render();
    }

    function showLevel(level){
      currentLevel = level;
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === level - 1));
      render();
    }

    function renderRefs(refs){
      return refs.map(r => `<li><a href="${r.url}" target="_blank">${r.text}</a></li>`).join('');
    }

    function renderSkills(skills){
      return skills.map(s => `
        <div class="skill">
          <h4>${s.title}</h4>
          <p><span class="label">${s.expLabel}</span> ${s.exp}</p>
          <p><span class="label">${s.exLabel}</span> ${s.ex}</p>
          <p class="ref"><span class="label">${currentLang === 'vi' ? 'Tham khảo UiPath Docs:' : 'UiPath Docs Reference:'}</span></p>
          <ul>${renderRefs(s.refs)}</ul>
        </div>
      `).join('');
    }

	function renderAssessment(level){

	  return `
		<div class="card">
		  <h2>${level.title}</h2>
		  <p>${level.intro}</p>

		  ${level.forms.map(form => `
			<div class="skill">
			  <h4>${form.title}</h4>
			  <p>${form.description}</p>

			  <a
				href="${form.url}"
				target="_blank"
				style="
				  display:inline-block;
				  background:#2563eb;
				  color:white;
				  padding:10px 20px;
				  border-radius:8px;
				  text-decoration:none;
				  font-weight:600;
				  margin-top:8px;
				">
				${currentLang === 'vi' ? 'Bắt đầu bài kiểm tra' : 'Start Assessment'}
			  </a>
			</div>
		  `).join('')}
		</div>
	  `;
	}

    function render(){
      const data = contentData[currentLang];
      const level = data.levels[currentLevel];

      document.getElementById('appTitle').innerText = data.appTitle;
      document.getElementById('appSubtitle').innerText = data.appSubtitle;
      document.getElementById('langLabel').innerText = data.langLabel;
      document.getElementById('hintText').innerText = data.hintText;
      document.getElementById('footerText').innerText = data.footerText;

      document.getElementById('tab1').innerText = data.tabs[0];
      document.getElementById('tab2').innerText = data.tabs[1];
      document.getElementById('tab3').innerText = data.tabs[2];
      document.getElementById('tab4').innerText = data.tabs[3];
	  document.getElementById('tab5').innerText = data.tabs[4];

	if(currentLevel === 5){
	  document.getElementById('levelContainer').innerHTML =
		renderAssessment(level);
	  return;
	}

      const html = `
        <div class="card">
          <h2>${level.title}</h2>
          <p>${level.intro}</p>
          <div class="grid-2">
            <div>
              <h3>${level.goalsTitle}</h3>
              <ul>${level.goals.map(g => `<li>${g}</li>`).join('')}</ul>
            </div>
            <div>
              <h3>${level.refsTitle}</h3>
              <ul>${renderRefs(level.refs)}</ul>
            </div>
          </div>
          ${renderSkills(level.skills)}
        </div>
      `;
      document.getElementById('levelContainer').innerHTML = html;
    }

    window.onload = function(){
      setLanguage('vi');
      showLevel(1);
    };
  </script>
