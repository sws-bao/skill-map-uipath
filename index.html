  <style>
    :root{
      --primary:#1f4e79;
      --primary-dark:#163a5c;
      --bg:#f4f7fb;
      --card:#ffffff;
      --border:#d9e2f3;
      --text:#222;
      --muted:#666;
      --accent:#4f8cff;
      --shadow:0 8px 24px rgba(31,78,121,.12);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, #eaf2ff 0%, transparent 30%),
        radial-gradient(circle at top right, #eef8f2 0%, transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, #f4f7fb 100%);
    }
    .container{max-width:1200px;margin:0 auto;padding:28px 20px 50px;}
    .hero{
      background:linear-gradient(135deg, #1f4e79 0%, #2f6ea8 55%, #4f8cff 100%);
      color:#fff;border-radius:20px;padding:28px 28px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    }
    .hero::after{
      content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);
    }
    .hero h1{margin:0 0 10px;font-size:30px;line-height:1.2;}
    .hero p{margin:0;max-width:900px;opacity:.95;}
    .toolbar{
      display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 18px;
      background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid rgba(217,226,243,.9);
      border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);
    }
    .lang-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .lang-box label{font-weight:700;color:var(--primary);}
    .lang-btn{
      padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-weight:700;background:#fff;color:var(--primary);
      border:1px solid var(--border);transition:.25s;
    }
    .lang-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
    .lang-btn:hover{transform:translateY(-1px);}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px;}
    .tab-btn{
      border:none;background:#fff;color:var(--primary);padding:12px 16px;border-radius:999px;cursor:pointer;font-weight:700;
      border:1px solid var(--border);box-shadow:0 4px 12px rgba(31,78,121,.08);transition:all .25s ease;
    }
    .tab-btn:hover{transform:translateY(-2px);border-color:var(--accent);}
    .tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
    .panel{display:none;opacity:0;transform:translateY(10px);transition:opacity .35s ease, transform .35s ease;}
    .panel.active{display:block;opacity:1;transform:translateY(0);animation:fadeSlide .35s ease;}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
    .card h2{margin-top:0;color:var(--primary);font-size:24px;}
    .card h3{color:var(--primary-dark);margin-bottom:10px;}
    .skill{padding:16px;border:1px solid #edf1f7;border-radius:14px;margin-top:14px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);}
    .skill h4{margin:0 0 8px;color:#173b5d;font-size:18px;}
    .label{font-weight:700;color:var(--primary);}
    .ref a{color:#1155cc;text-decoration:none;word-break:break-word;}
    .ref a:hover{text-decoration:underline;}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .note{color:var(--muted);font-style:italic;margin-top:8px;}
    ul{margin-top:8px;}
    .footer{margin-top:18px;color:var(--muted);text-align:center;font-size:13px;}
    .hidden{display:none !important;}
    @media (max-width:900px){.grid-2{grid-template-columns:1fr;}.hero h1{font-size:24px;}}
  </style>
</head>

    function renderLevel(level) {
      const data = contentData[currentLang].levels[level];
      const skills = data.skills.map(skill => `
        <div class="skill">
          <h4>${skill.title}</h4>
          <div><span class="label">${skill.expLabel}</span> ${skill.exp}</div>
          <div style="margin-top:8px;"><span class="label">${skill.exLabel}</span> ${skill.ex}</div>
          <div class="ref" style="margin-top:10px;">
            ${skill.refs.map(ref => `<div><a href="${ref.url}" target="_blank" rel="noreferrer">${ref.text}</a></div>`).join('')}
          </div>
        </div>
      `).join('');

      const refs = data.refs.map(ref => `<li><a href="${ref.url}" target="_blank" rel="noreferrer">${ref.text}</a></li>`).join('');
      const goals = data.goals.map(goal => `<li>${goal}</li>`).join('');

      levelContainer.innerHTML = `
        <div class="panel active card">
          <h2>${data.title}</h2>
          <p>${data.intro}</p>

          <div class="grid-2">
            <div>
              <h3>${data.goalsTitle}</h3>
              <ul>${goals}</ul>
            </div>
            <div>
              <h3>${data.refsTitle}</h3>
              <ul class="ref">${refs}</ul>
            </div>
          </div>

          <div>${skills}</div>
        </div>
      `;
    }

      document.getElementById('appSubtitle').textContent = t.appSubtitle;
      document.getElementById('langLabel').textContent = t.langLabel;
      document.getElementById('hintText').textContent = t.hintText;
      document.getElementById('footerText').textContent = t.footerText;

      tabs.forEach((tab, idx) => { tab.textContent = t.tabs[idx]; });
      langButtons.forEach(btn => btn.classList.toggle('active', btn.id === (lang === 'vi' ? 'btnVi' : 'btnEn')));
      renderLevel(currentLevel);
    }

    function showLevel(level) {
      currentLevel = level;
      tabs.forEach((tab, idx) => tab.classList.toggle('active', idx + 1 === level));
      renderLevel(level);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setLanguage('vi');
      showLevel(1);
    });
  </script>
</body>
</html>
